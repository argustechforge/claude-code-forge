<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'IBM Plex Sans','Segoe UI',sans-serif">
  <defs>
    <style>.mono{font-family:'JetBrains Mono','Consolas',monospace;} .lbl{fill:#E9EDF1;} .mut{fill:#8B96A3;}</style>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8B96A3"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#0B0E11"/>

  <!-- edges -->
  <g stroke="#8B96A3" stroke-width="1.6" fill="none" marker-end="url(#ah)">
    <line x1="800" y1="120" x2="800" y2="168"/>            <!-- top -> D1 -->
    <line x1="748" y1="205" x2="360" y2="205"/>            <!-- D1 No -> OFF -->
    <line x1="800" y1="248" x2="800" y2="300"/>            <!-- D1 Yes -> D2 -->
    <line x1="852" y1="337" x2="1240" y2="337"/>           <!-- D2 No -> CREDITS_ONLY -->
    <line x1="800" y1="380" x2="800" y2="440"/>            <!-- D2 Yes -> D3 -->
    <line x1="740" y1="485" x2="360" y2="485"/>            <!-- D3 Yes -> FREE -->
    <line x1="860" y1="485" x2="1240" y2="485"/>           <!-- D3 Unknown -> SHARE_RISK -->
  </g>

  <!-- edge labels -->
  <text class="mono mut" x="560" y="196" font-size="17" text-anchor="middle">No</text>
  <text class="mono mut" x="820" y="278" font-size="17">Yes</text>
  <text class="mono mut" x="1050" y="328" font-size="17" text-anchor="middle">No</text>
  <text class="mono mut" x="820" y="418" font-size="17">Yes</text>
  <text class="mono mut" x="545" y="476" font-size="17" text-anchor="middle">Yes</text>
  <text class="mono mut" x="1165" y="462" font-size="15" text-anchor="middle">unknown /</text><text class="mono mut" x="1165" y="480" font-size="15" text-anchor="middle">near cap</text>

  <!-- top node -->
  <rect x="620" y="70" width="360" height="52" rx="8" fill="#14181D" stroke="#3A424C" stroke-width="1.5"/>
  <text class="lbl" x="800" y="103" font-size="24" font-weight="600" text-anchor="middle">FABLE GATE CHECK</text>

  <!-- Diamond 1 -->
  <g transform="translate(800,205)">
    <polygon points="0,-38 210,0 0,38 -210,0" fill="#1B2027" stroke="#262C34" stroke-width="1.5"/>
    <text class="mono lbl" x="0" y="6" font-size="19" text-anchor="middle">enabled in table?</text>
  </g>
  <!-- OFF -->
  <g transform="translate(130,180)">
    <rect width="230" height="60" rx="8" fill="none" stroke="#525A64" stroke-width="2"/>
    <circle cx="34" cy="30" r="13" fill="none" stroke="#525A64" stroke-width="2"/><line x1="25" y1="39" x2="43" y2="21" stroke="#525A64" stroke-width="2"/>
    <text class="mono" x="130" y="27" font-size="20" font-weight="600" fill="#525A64" text-anchor="middle">OFF</text>
    <text x="130" y="47" font-size="12" fill="#525A64" text-anchor="middle">disabled in policy &#8212; inert</text>
  </g>

  <!-- Diamond 2 -->
  <g transform="translate(800,340)">
    <polygon points="0,-40 250,0 0,40 -250,0" fill="#1B2027" stroke="#262C34" stroke-width="1.5"/>
    <text class="mono lbl" x="0" y="-2" font-size="18" text-anchor="middle">inside promo window?</text>
    <text class="mono mut" x="0" y="20" font-size="13" text-anchor="middle">date_gates.fable_free_until</text>
  </g>
  <!-- CREDITS_ONLY -->
  <g transform="translate(1240,308)">
    <rect width="250" height="62" rx="8" fill="none" stroke="#E24C5C" stroke-width="2"/>
    <rect x="22" y="22" width="26" height="18" rx="3" fill="none" stroke="#E24C5C" stroke-width="2"/><line x1="22" y1="29" x2="48" y2="29" stroke="#E24C5C" stroke-width="2"/>
    <text class="mono" x="150" y="28" font-size="19" font-weight="600" fill="#E24C5C" text-anchor="middle">CREDITS_ONLY</text>
    <text x="150" y="47" font-size="12" fill="#8B96A3" text-anchor="middle">billed credits, hard state</text>
  </g>

  <!-- Diamond 3 -->
  <g transform="translate(800,485)">
    <polygon points="0,-46 300,0 0,46 -300,0" fill="#1B2027" stroke="#262C34" stroke-width="1.5"/>
    <text class="mono lbl" x="0" y="-4" font-size="17" text-anchor="middle">usage known AND under weekly cap?</text>
    <text class="mono mut" x="0" y="18" font-size="13" text-anchor="middle">max_week_all_pct, default 50%</text>
  </g>
  <!-- FREE -->
  <g transform="translate(130,454)">
    <rect width="230" height="62" rx="8" fill="none" stroke="#3ACB6E" stroke-width="2"/>
    <path d="M24 30 l8 9 l16 -18" fill="none" stroke="#3ACB6E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="mono" x="140" y="28" font-size="20" font-weight="600" fill="#3ACB6E" text-anchor="middle">FREE</text>
    <text x="140" y="47" font-size="12" fill="#8B96A3" text-anchor="middle">go &#8212; no confirmation needed</text>
  </g>
  <!-- SHARE_RISK -->
  <g transform="translate(1240,454)">
    <rect width="250" height="62" rx="8" fill="none" stroke="#F2A93D" stroke-width="2"/>
    <path d="M34 40 L47 18 L60 40 Z" fill="none" stroke="#F2A93D" stroke-width="2" stroke-linejoin="round"/><line x1="47" y1="26" x2="47" y2="33" stroke="#F2A93D" stroke-width="2"/><circle cx="47" cy="37" r="1.3" fill="#F2A93D"/>
    <text class="mono" x="150" y="28" font-size="19" font-weight="600" fill="#F2A93D" text-anchor="middle">SHARE_RISK</text>
    <text x="150" y="47" font-size="12" fill="#8B96A3" text-anchor="middle">advisory: true &#8212; confirm before use</text>
  </g>

  <!-- takeaway banner -->
  <rect x="330" y="700" width="940" height="56" rx="6" fill="#14181D" stroke="#262C34"/>
  <text class="mono lbl" x="800" y="735" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="1">HARD GATE ON CERTAINTY &#183; SOFT GATE ON UNCERTAINTY &#183; NEVER SILENTLY OVERSPEND</text>
  <!-- bottom 10% left dark for caption -->
</svg>

