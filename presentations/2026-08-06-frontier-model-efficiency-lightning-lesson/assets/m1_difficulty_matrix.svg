<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'IBM Plex Sans','Segoe UI',sans-serif">
  <defs><style>
    .mono{font-family:'JetBrains Mono','Consolas',monospace;}
    .lbl{fill:#E9EDF1;} .mut{fill:#8B96A3;}
  </style></defs>
  <rect x="0" y="0" width="1600" height="900" fill="#0B0E11"/>
  <!-- top 15% reserved for live headline -->
  <text class="lbl" x="280" y="140" font-size="18" font-weight="600" letter-spacing="3" fill="#8B96A3">MODEL TIER  &#8594;</text>
  <!-- tier headers -->
  <rect x="280" y="160" width="320" height="4" fill="#3DB8E8"/><circle cx="380" cy="200" r="7" fill="#3DB8E8"/><text class="mono lbl" x="398" y="206" font-size="26" font-weight="600">HAIKU</text>
  <rect x="600" y="160" width="320" height="4" fill="#4C7CF0"/><circle cx="690" cy="200" r="7" fill="#4C7CF0"/><text class="mono lbl" x="708" y="206" font-size="26" font-weight="600">SONNET</text>
  <rect x="920" y="160" width="320" height="4" fill="#8B5CF6"/><circle cx="1024" cy="200" r="7" fill="#8B5CF6"/><text class="mono lbl" x="1042" y="206" font-size="26" font-weight="600">OPUS</text>
  <rect x="1240" y="160" width="320" height="4" fill="#F2B33D"/><circle cx="1338" cy="200" r="7" fill="#F2B33D"/><text class="mono lbl" x="1356" y="206" font-size="26" font-weight="600">FABLE</text>
  <!-- difficulty row headers (ascending fill) -->
  <rect x="90" y="230" width="190" height="155" fill="#1B2027" stroke="#262C34"/><text class="lbl" x="185" y="315" font-size="24" font-weight="600" text-anchor="middle">LOW</text>
  <rect x="90" y="385" width="190" height="155" fill="#262C34" stroke="#262C34"/><text class="lbl" x="185" y="470" font-size="24" font-weight="600" text-anchor="middle">MEDIUM</text>
  <rect x="90" y="540" width="190" height="155" fill="#3A424C" stroke="#262C34"/><text class="lbl" x="185" y="625" font-size="24" font-weight="600" text-anchor="middle">HIGH</text>
  <rect x="90" y="695" width="190" height="155" fill="#525A64" stroke="#262C34"/><text class="lbl" x="185" y="780" font-size="24" font-weight="600" text-anchor="middle">DEEP</text>
  <text x="52" y="540" font-size="18" font-weight="600" letter-spacing="3" fill="#8B96A3" text-anchor="middle" transform="rotate(-90 52 540)">TASK DIFFICULTY</text>
  <!-- grid -->
  <g stroke="#262C34" stroke-width="1">
    <line x1="280" y1="230" x2="1560" y2="230"/><line x1="280" y1="385" x2="1560" y2="385"/><line x1="280" y1="540" x2="1560" y2="540"/><line x1="280" y1="695" x2="1560" y2="695"/><line x1="280" y1="850" x2="1560" y2="850"/>
    <line x1="280" y1="230" x2="280" y2="850"/><line x1="600" y1="230" x2="600" y2="850"/><line x1="920" y1="230" x2="920" y2="850"/><line x1="1240" y1="230" x2="1240" y2="850"/><line x1="1560" y1="230" x2="1560" y2="850"/>
  </g>
  <!-- LOW,HAIKU low n1 diag -->
  <g transform="translate(280,230)"><rect width="320" height="155" fill="#3DB8E8" fill-opacity="0.18"/><rect x="4" y="4" width="312" height="147" fill="none" stroke="#3DB8E8" stroke-width="2"/>
    <rect x="113" y="79" width="14" height="16" fill="#E9EDF1"/><rect x="133" y="71" width="14" height="24" fill="#3A424C"/><rect x="153" y="63" width="14" height="32" fill="#3A424C"/><rect x="173" y="55" width="14" height="40" fill="#3A424C"/><rect x="193" y="47" width="14" height="48" fill="#3A424C"/>
    <text class="mono lbl" x="160" y="122" font-size="20" text-anchor="middle">low</text></g>
  <!-- MEDIUM,HAIKU medium n2 -->
  <g transform="translate(280,385)"><rect width="320" height="155" fill="#3DB8E8" fill-opacity="0.18"/>
    <rect x="113" y="79" width="14" height="16" fill="#E9EDF1"/><rect x="133" y="71" width="14" height="24" fill="#E9EDF1"/><rect x="153" y="63" width="14" height="32" fill="#3A424C"/><rect x="173" y="55" width="14" height="40" fill="#3A424C"/><rect x="193" y="47" width="14" height="48" fill="#3A424C"/>
    <text class="mono lbl" x="160" y="122" font-size="20" text-anchor="middle">medium</text></g>
  <!-- MEDIUM,SONNET medium n2 diag -->
  <g transform="translate(600,385)"><rect width="320" height="155" fill="#4C7CF0" fill-opacity="0.18"/><rect x="4" y="4" width="312" height="147" fill="none" stroke="#4C7CF0" stroke-width="2"/>
    <rect x="113" y="79" width="14" height="16" fill="#E9EDF1"/><rect x="133" y="71" width="14" height="24" fill="#E9EDF1"/><rect x="153" y="63" width="14" height="32" fill="#3A424C"/><rect x="173" y="55" width="14" height="40" fill="#3A424C"/><rect x="193" y="47" width="14" height="48" fill="#3A424C"/>
    <text class="mono lbl" x="160" y="122" font-size="20" text-anchor="middle">medium</text></g>
  <!-- HIGH,SONNET high n3 -->
  <g transform="translate(600,540)"><rect width="320" height="155" fill="#4C7CF0" fill-opacity="0.18"/>
    <rect x="113" y="79" width="14" height="16" fill="#E9EDF1"/><rect x="133" y="71" width="14" height="24" fill="#E9EDF1"/><rect x="153" y="63" width="14" height="32" fill="#E9EDF1"/><rect x="173" y="55" width="14" height="40" fill="#3A424C"/><rect x="193" y="47" width="14" height="48" fill="#3A424C"/>
    <text class="mono lbl" x="160" y="122" font-size="20" text-anchor="middle">high</text></g>
  <!-- HIGH,OPUS high n3 diag -->
  <g transform="translate(920,540)"><rect width="320" height="155" fill="#8B5CF6" fill-opacity="0.18"/><rect x="4" y="4" width="312" height="147" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="113" y="79" width="14" height="16" fill="#E9EDF1"/><rect x="133" y="71" width="14" height="24" fill="#E9EDF1"/><rect x="153" y="63" width="14" height="32" fill="#E9EDF1"/><rect x="173" y="55" width="14" height="40" fill="#3A424C"/><rect x="193" y="47" width="14" height="48" fill="#3A424C"/>
    <text class="mono lbl" x="160" y="122" font-size="20" text-anchor="middle">high</text></g>
  <!-- DEEP,OPUS xhigh n4 -->
  <g transform="translate(920,695)"><rect width="320" height="155" fill="#8B5CF6" fill-opacity="0.18"/>
    <rect x="113" y="79" width="14" height="16" fill="#E9EDF1"/><rect x="133" y="71" width="14" height="24" fill="#E9EDF1"/><rect x="153" y="63" width="14" height="32" fill="#E9EDF1"/><rect x="173" y="55" width="14" height="40" fill="#E9EDF1"/><rect x="193" y="47" width="14" height="48" fill="#3A424C"/>
    <text class="mono lbl" x="160" y="122" font-size="20" text-anchor="middle">xhigh</text></g>
  <!-- DEEP,FABLE max n5 diag -->
  <g transform="translate(1240,695)"><rect width="320" height="155" fill="#F2B33D" fill-opacity="0.18"/><rect x="4" y="4" width="312" height="147" fill="none" stroke="#F2B33D" stroke-width="2"/>
    <rect x="113" y="79" width="14" height="16" fill="#E9EDF1"/><rect x="133" y="71" width="14" height="24" fill="#E9EDF1"/><rect x="153" y="63" width="14" height="32" fill="#E9EDF1"/><rect x="173" y="55" width="14" height="40" fill="#E9EDF1"/><rect x="193" y="47" width="14" height="48" fill="#E9EDF1"/>
    <text class="mono lbl" x="160" y="122" font-size="20" text-anchor="middle">max</text></g>
  <!-- flagged empty: LOW,FABLE -->
  <g transform="translate(1240,230)"><path d="M160 58 L184 100 L136 100 Z" fill="none" stroke="#8B96A3" stroke-width="2.5" stroke-linejoin="round"/><line x1="160" y1="74" x2="160" y2="88" stroke="#8B96A3" stroke-width="2.5"/><circle cx="160" cy="94" r="1.6" fill="#8B96A3"/><text class="mono mut" x="160" y="126" font-size="16" text-anchor="middle">don&#39;t route here</text></g>
  <!-- flagged empty: DEEP,HAIKU -->
  <g transform="translate(280,695)"><path d="M160 58 L184 100 L136 100 Z" fill="none" stroke="#8B96A3" stroke-width="2.5" stroke-linejoin="round"/><line x1="160" y1="74" x2="160" y2="88" stroke="#8B96A3" stroke-width="2.5"/><circle cx="160" cy="94" r="1.6" fill="#8B96A3"/><text class="mono mut" x="160" y="126" font-size="16" text-anchor="middle">don&#39;t route here</text></g>
</svg>
